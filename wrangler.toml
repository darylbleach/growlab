name = "growlab"
main = "src/index.ts"
compatibility_date = "2025-09-15"
compatibility_flags = ["nodejs_compat"]

# Static SPA is uploaded to R2 prefix `site/` and served by the Worker.

[[d1_databases]]
binding = "DB"
database_name = "growlab"
database_id = "aa0c5b25-6ebe-4a07-92c7-652a4cb729a1"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "growlab-media"

[[kv_namespaces]]
binding = "KV"
id = "496a933e0a2049ca8a0e03a87e52b3b6"

[[queues.producers]]
binding = "JOBS"
queue = "growlab-jobs"

[[queues.consumers]]
queue = "growlab-jobs"
max_batch_size = 5
max_retries = 5
max_batch_timeout = 5

[triggers]
crons = ["* * * * *"]

[vars]
APP_NAME = "GrowLab"
APP_URL = "https://growlab.darylbleach.workers.dev"
SITE_PREFIX = "site"

# Secrets (set via wrangler secret / API):
# APP_PASSWORD, SESSION_SECRET, TOKEN_ENCRYPTION_SECRET
# X_CLIENT_ID, X_CLIENT_SECRET
# OPENAI_API_KEY (optional), ANTHROPIC_API_KEY (optional)
# BLUESKY_HANDLE, BLUESKY_APP_PASSWORD (optional)
